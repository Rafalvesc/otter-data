name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint e testes offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Instalar dependências
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Ruff
        run: ruff check . && ruff format --check backend desktop scripts tests
      # Integration tests need PostgreSQL and are skipped here; they run locally with
      # `pytest --run-integration` after `docker compose up`.
      - name: Pytest
        run: python -m pytest -q
