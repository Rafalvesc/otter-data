name: Release

# Publishing a tag like v1.0.0 builds the Windows installer and attaches it to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-installer:
    name: Instalador Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-desktop.lock
      - name: Instalar dependências
        run: |
          python -m pip install -r requirements.lock -r requirements-desktop.lock pyinstaller==6.22.3
          python -m pip install -e . --no-deps
      - name: Testes offline
        run: python -m pytest -q
      - name: Empacotar o app (PyInstaller)
        run: pyinstaller packaging/otterdata.spec --noconfirm --distpath dist --workpath build
      - name: Gerar o instalador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\installer.iss
      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OtterData-Setup-*.exe
          generate_release_notes: true
