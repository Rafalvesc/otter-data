<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Otter Data</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; overflow: hidden;
    background: #F6F0E4; color: #2A2622; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { width: min(420px, 100% - 48px); }
  img { display: block; width: 210px; height: auto; }
  h1 { margin: 18px 0 0; padding-bottom: 10px; border-bottom: 1px solid #4A3B30;
    font: 600 30px/1 Georgia, serif; letter-spacing: -.01em; }
  h1 span { color: #8A5A42; }
  #status { min-height: 24px; margin-top: 10px; color: #5A4E44; font: italic 16px Georgia, serif; }
  .bar { display: block; width: 100%; height: 22px; margin-top: 6px; overflow: hidden; }
  .bar path { fill: none; stroke-width: 1.7; vector-effect: non-scaling-stroke; animation: drift 1.8s linear infinite; }
  .bar .back { stroke: rgba(90, 66, 46, .22); animation-duration: 2.8s; }
  .bar .front { stroke: #A3603E; }
  @keyframes drift { to { transform: translateX(-80px); } }
  .error .bar, .ready .bar { display: none; }
  .error #status { color: #A83A30; }
  .warn #status { color: #7A5512; }
  button { display: none; margin-top: 16px; padding: 8px 18px; cursor: pointer; border-radius: 2px;
    font: 700 14px "Segoe UI", sans-serif; color: #FBF5EA; background: #9A5636; border: 0; }
  .error button { display: inline-block; }
  @media (prefers-reduced-motion: reduce) { .bar path { animation: none; } }
</style></head>
<body><main id="root">
  <img src="data:image/webp;base64,__OTTER__" alt="">
  <h1>Otter <span>Data</span></h1>
  <div id="status">Preparing…</div>
  <svg class="bar" viewBox="0 0 240 40" preserveAspectRatio="none" aria-hidden="true">
    <path class="back" d="M0 18 q20 -7 40 0 t40 0 q20 -7 40 0 t40 0 q20 -7 40 0 t40 0 q20 -7 40 0 t40 0 q20 -7 40 0 t40 0 q20 -7 40 0 t40 0"/>
    <path class="front" d="M0 26 q20 -6 40 0 t40 0 q20 -6 40 0 t40 0 q20 -6 40 0 t40 0 q20 -6 40 0 t40 0 q20 -6 40 0 t40 0 q20 -6 40 0 t40 0"/>
  </svg>
  <button onclick="window.pywebview.api.retry()">Try again</button>
</main>
<script>
  function setStatus(text, state) {
    document.getElementById("status").textContent = text;
    document.getElementById("root").className = state;
  }
</script></body></html>
